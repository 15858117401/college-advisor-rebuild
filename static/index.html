<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>College Advisor</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f6fb;
        color: #172033;
      }

      * { box-sizing: border-box; }

      body {
        align-items: center;
        background: radial-gradient(circle at top, #e7edff 0, #f4f6fb 43%, #eef2f8 100%);
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: rgba(255, 255, 255, .92);
        border: 1px solid #dfe5f1;
        border-radius: 22px;
        box-shadow: 0 24px 70px rgba(31, 52, 95, .14);
        display: flex;
        flex-direction: column;
        height: min(760px, calc(100vh - 48px));
        max-width: 760px;
        overflow: hidden;
        width: 100%;
      }

      header {
        align-items: center;
        border-bottom: 1px solid #e8ecf4;
        display: flex;
        gap: 12px;
        padding: 18px 22px;
      }

      .mark {
        align-items: center;
        background: #264c9b;
        border-radius: 11px;
        color: white;
        display: flex;
        font-size: 18px;
        font-weight: 800;
        height: 38px;
        justify-content: center;
        width: 38px;
      }

      h1 { font-size: 16px; margin: 0; }
      header p { color: #6c7689; font-size: 13px; margin: 3px 0 0; }

      #messages {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 14px;
        overflow-y: auto;
        padding: 24px 22px;
      }

      .message {
        border-radius: 16px;
        line-height: 1.55;
        max-width: 86%;
        padding: 11px 14px;
        white-space: pre-wrap;
      }

      .assistant { align-self: flex-start; background: #eef2fa; color: #263149; }
      .user { align-self: flex-end; background: #264c9b; color: white; }
      .error { align-self: flex-start; background: #fff0f1; color: #a22d3d; }

      #suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .suggestion {
        background: white;
        border: 1px solid #d9e0ed;
        border-radius: 999px;
        color: #42506a;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        padding: 8px 11px;
      }

      .suggestion:hover { border-color: #7694d5; color: #264c9b; }

      form {
        align-items: flex-end;
        border-top: 1px solid #e8ecf4;
        display: flex;
        gap: 10px;
        padding: 16px 18px;
      }

      textarea {
        border: 1px solid #cfd7e7;
        border-radius: 14px;
        color: inherit;
        flex: 1;
        font: inherit;
        min-height: 48px;
        outline: none;
        padding: 13px;
        resize: none;
      }

      textarea:focus { border-color: #5577c5; box-shadow: 0 0 0 3px #e3ebff; }

      button[type="submit"] {
        background: #264c9b;
        border: 0;
        border-radius: 14px;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        min-height: 48px;
        padding: 0 18px;
      }

      button[type="submit"]:disabled { background: #9aa9c8; cursor: wait; }

      @media (max-width: 560px) {
        body { padding: 0; }
        main { border: 0; border-radius: 0; height: 100vh; }
        .message { max-width: 92%; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">C</div>
        <div>
          <h1>College Advisor</h1>
          <p>Ask about UIUC courses, requirements, and schedules.</p>
        </div>
      </header>

      <section id="messages" aria-live="polite">
        <div class="message assistant">Hi! What would you like to plan or look up?</div>
        <div id="suggestions">
          <button class="suggestion" type="button">What are the Statistics major requirements?</button>
          <button class="suggestion" type="button">Find a 3-credit Humanities course.</button>
          <button class="suggestion" type="button">Help me plan next semester.</button>
        </div>
      </section>

      <form id="chat-form">
        <textarea id="prompt" aria-label="Your question" placeholder="Ask a question…" rows="1" required></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </main>

    <script>
      const form = document.querySelector("#chat-form");
      const input = document.querySelector("#prompt");
      const messages = document.querySelector("#messages");
      const send = document.querySelector("#send");

      function addMessage(text, role) {
        const message = document.createElement("div");
        message.className = `message ${role}`;
        message.textContent = text;
        messages.append(message);
        messages.scrollTop = messages.scrollHeight;
        return message;
      }

      async function ask(text) {
        const question = text.trim();
        if (!question || send.disabled) return;

        input.value = "";
        addMessage(question, "user");
        send.disabled = true;
        send.textContent = "Thinking…";
        const pending = addMessage("Thinking…", "assistant");

        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: question }),
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.detail || "The request failed.");
          pending.textContent = payload.response || "I could not generate a response.";
        } catch (error) {
          pending.className = "message error";
          pending.textContent = error.message || "Unable to reach the advisor. Please try again.";
        } finally {
          send.disabled = false;
          send.textContent = "Send";
          input.focus();
          messages.scrollTop = messages.scrollHeight;
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        ask(input.value);
      });

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          ask(input.value);
        }
      });

      document.querySelectorAll(".suggestion").forEach((button) => {
        button.addEventListener("click", () => ask(button.textContent));
      });
    </script>
  </body>
</html>
