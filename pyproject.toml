[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "college-advisor-rebuild"
version = "0.1.0"
description = "Python rebuild of College Advisor using DeepSeek and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "langchain-openai>=1,<2",
    "langgraph>=1.1.5,<2",
    "python-dotenv>=1.1,<2",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4,<1",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
